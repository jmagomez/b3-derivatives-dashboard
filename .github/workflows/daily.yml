name: Atualizacao diaria + e-mail (21h BRT)

on:
  schedule:
    # 00:00 UTC = 21:00 BRT do dia anterior. E o primeiro instante em que TODAS
    # as fontes do pregao anterior estao fechadas: NY e B3 ja encerraram e a
    # barra diaria do bitcoin acabou de fechar (00:00 UTC).
    - cron: "0 0 * * *"
    # Retentativas: a publicacao espera o fechamento consolidado do bitcoin
    # (scripts/publicacao.py). Se ele ainda nao estiver no Yahoo, o run grava
    # data/ e adia docs/ + e-mail; estas execucoes completam depois. O e-mail so
    # sai no primeiro sucesso de cada pregao (steps.upd.outputs.novo).
    - cron: "0 3,6,9,12 * * *"
  workflow_dispatch:

# Mesmo grupo do backfill.yml: nunca dois jobs commitando em data/ ao mesmo tempo.
concurrency:
  group: atualizacao-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_B3 }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Atualizar dados e (se o bitcoin fechou) gerar site/e-mail
        id: upd
        run: python scripts/update.py

      - name: Commit dos dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Atualizacao diaria $(date -u +%F)"
          # Caso um push manual tenha mexido na main durante o job.
          git pull --rebase --autostash
          git push

      - name: Enviar e-mail
        if: env.MAIL_USERNAME != '' && steps.upd.outputs.novo == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD_B3 }}
          subject: "Derivativos B3 — resumo diario"
          to: jmagomez@gmail.com
          from: "Dashboard Derivativos B3"
          html_body: file://email_body.html
