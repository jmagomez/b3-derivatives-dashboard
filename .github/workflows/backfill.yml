name: Backfill historico (desde 2020)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Data inicial (YYYY-MM-DD)"
        default: "2020-01-01"
      end:
        description: "Data final (YYYY-MM-DD, vazio = hoje)"
        default: ""

# Mesmo grupo do daily.yml: nunca dois jobs commitando em data/ ao mesmo tempo.
concurrency:
  group: atualizacao-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Mesmo pipeline do daily (B3, BCB, EIA, Yahoo, site, e-mail), em modo backfill:
      # --start desliga o gate do bitcoin e a janela de 10 dias.
      - name: Backfill
        run: python scripts/update.py --start "$START" ${END:+--end "$END"}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Backfill historico"
          git pull --rebase --autostash
          git push
